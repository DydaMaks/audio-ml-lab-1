name: Lab2 MLOps Docker

on:
  push:
    branches: [main, lab2-mlops, lab2-quality-gate-fail]
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2.yml'
  pull_request:
    paths:
      - 'lab2/**'
      - '.github/workflows/lab2.yml'
  workflow_dispatch:
    inputs:
      acc_threshold:
        description: "Accuracy threshold (%) for quality gate"
        required: false
        default: "60"

permissions:
  contents: read
jobs:
  docker-mlops:
    name: Docker build, compare environments, verify API and metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Python code
        run: python -m compileall -q lab2
      - name: Install benchmark and document tools on runner
        run: python -m pip install -q requests==2.32.3 python-docx==1.2.0 Pillow==11.3.0 reportlab==4.4.3
      - name: Build both Docker images and measure local vs Docker
        env:
          ACC_THRESHOLD: ${{ github.event.inputs.acc_threshold || '99' }}
        run: python lab2/scripts/ci.py
      - name: Generate authentic DOCX PDF and log snapshots
        run: python lab2/reporting/make_report.py
      - name: Upload complete results and final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-mlops-results-${{ github.run_number }}
          path: |
            lab2/results/
          if-no-files-found: warn
          retention-days: 30
